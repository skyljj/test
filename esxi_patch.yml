---
- name: Validate required patch variables
  ansible.builtin.fail:
    msg: "esxi_patch_url or esxi_patch_package is required"
  when:
    - esxi_patch_url | default('') | length == 0
    - esxi_patch_package | default('') | length == 0
  run_once: true

- name: Resolve target cluster membership
  ansible.builtin.include_tasks: resolve_cluster.yml

- name: Skip ESXi not in target cluster
  ansible.builtin.debug:
    msg: "Skip {{ inventory_hostname }}, not in cluster '{{ cluster_name }}'"
  when: not (esxi_in_target_cluster | default(false) | bool)

- name: Enable SSH on ESXi
  community.vmware.vmware_host_service_manager:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ validate_certs }}"
    esxi_hostname: "{{ inventory_hostname }}"
    service_name: TSM-SSH
    state: present
  delegate_to: localhost
  when:
    - esxi_in_target_cluster | default(false) | bool
    - esxi_enable_ssh | bool
    - vcenter_hostname | default('') | length > 0

- name: Prepare patch and VIBs once on shared cluster datastore
  ansible.builtin.include_tasks: prepare_packages.yml
  run_once: true
  delegate_to: "{{ esxi_prepare_host }}"
  when:
    - esxi_patch_prepare | default(true) | bool
    - esxi_prepare_host is defined

- name: Share prepared package paths to this cluster host
  ansible.builtin.include_tasks: share_package_facts.yml
  when:
    - esxi_patch_apply | default(true) | bool
    - esxi_in_target_cluster | default(false) | bool
    - inventory_hostname != esxi_prepare_host

- name: Patch this ESXi host
  ansible.builtin.include_tasks: patch_host.yml
  when:
    - esxi_patch_apply | default(true) | bool
    - esxi_in_target_cluster | default(false) | bool

- name: Disable SSH on ESXi
  community.vmware.vmware_host_service_manager:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ validate_certs }}"
    esxi_hostname: "{{ inventory_hostname }}"
    service_name: TSM-SSH
    state: absent
  delegate_to: localhost
  when:
    - esxi_in_target_cluster | default(false) | bool
    - esxi_disable_ssh_after | bool
    - vcenter_hostname | default('') | length > 0
    - esxi_patch_apply | default(true) | bool



---
- name: Put ESXi host into maintenance mode
  community.vmware.vmware_maintenancemode:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ validate_certs }}"
    esxi_hostname: "{{ inventory_hostname }}"
    state: present
    evacuate: "{{ esxi_maintenance_evacuate }}"
    timeout: "{{ esxi_maintenance_timeout }}"
  delegate_to: localhost
  when:
    - vcenter_hostname | default('') | length > 0

- name: Apply server patch from datastore zip
  ansible.builtin.command:
    argv: "{{ ['esxcli', 'software', 'vib', 'update', '-d', esxi_patch_path] + (['--no-sig-check'] if esxi_patch_no_sig_check else []) }}"
  register: esxi_patch_result
  changed_when: esxi_patch_result.rc == 0

- name: Show patch result
  ansible.builtin.debug:
    msg: "{{ esxi_patch_result.stdout_lines | default([]) }}"

- name: Install extra VIBs
  ansible.builtin.command:
    argv: "{{ ['esxcli', 'software', 'vib', 'install', '-v', item] + (['--no-sig-check'] if esxi_patch_no_sig_check else []) }}"
  loop: "{{ esxi_vib_paths | default([]) }}"
  loop_control:
    label: "{{ item }}"
  register: esxi_vib_result
  when: esxi_vib_paths | default([]) | length > 0

- name: Reboot ESXi host after patch
  ansible.builtin.reboot:
    reboot_timeout: "{{ esxi_patch_reboot_timeout }}"
    connect_timeout: 30
    msg: "Reboot after ESXi patch"
  when: esxi_patch_reboot | bool

- name: Exit maintenance mode
  community.vmware.vmware_maintenancemode:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ validate_certs }}"
    esxi_hostname: "{{ inventory_hostname }}"
    state: absent
  delegate_to: localhost
  when:
    - vcenter_hostname | default('') | length > 0



---
# On one cluster host: find shared datastore, ISO folder, patch/vibs.
# vsan: volume name starts with vsan
# powerflex: volume name contains cluster_name and ends with 01, e.g. E:<cluster_name>:x:xx01

- name: List datastore display names under /vmfs/volumes
  ansible.builtin.command: ls -1 /vmfs/volumes
  register: esxi_volume_listing
  changed_when: false

- name: Fail if volume listing is empty
  ansible.builtin.fail:
    msg: "Failed to list /vmfs/volumes on {{ inventory_hostname }}"
  when: esxi_volume_listing.stdout_lines | default([]) | length == 0

- name: Select matching datastore names (skip UUID folders)
  ansible.builtin.set_fact:
    esxi_ds_names: >-
      {%- set ns = namespace(names=[]) -%}
      {%- for name in esxi_volume_listing.stdout_lines -%}
        {%- set vol = name | trim -%}
        {%- set is_uuid = vol is match('(?i)^[0-9a-f]{8}-[0-9a-f]{4,8}-[0-9a-f]{4}-[0-9a-f]{4,12}$') or vol is match('(?i)^[0-9a-f]{32}$') -%}
        {%- if vol and not is_uuid -%}
          {%- if storage_type | lower == 'vsan' and vol.lower().startswith('vsan') -%}
            {%- set ns.names = ns.names + [vol] -%}
          {%- elif storage_type | lower == 'powerflex' and (cluster_name in vol) and vol.endswith('01') -%}
            {%- set ns.names = ns.names + [vol] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.names }}

- name: Fail if no matching datastore name
  ansible.builtin.fail:
    msg: >-
      No datastore name for storage_type={{ storage_type }} cluster_name={{ cluster_name }}
      on {{ inventory_hostname }}. Volumes: {{ esxi_volume_listing.stdout_lines }}
  when: esxi_ds_names | length == 0

- name: Use first matching datastore name if more than one
  ansible.builtin.debug:
    msg: "Matched {{ esxi_ds_names | length }} datastore names, using the first one: {{ esxi_ds_names[0] }}"
  when: esxi_ds_names | length > 1

- name: Set datastore name and mount path
  ansible.builtin.set_fact:
    esxi_ds_name: "{{ esxi_ds_names[0] }}"
    esxi_ds_mount: "/vmfs/volumes/{{ esxi_ds_names[0] }}"
  when: esxi_ds_names | length > 0

- name: Set ISO directory and patch path
  ansible.builtin.set_fact:
    esxi_iso_dir: "{{ esxi_ds_mount }}/{{ esxi_iso_folder }}"
    esxi_patch_path: "{{ esxi_ds_mount }}/{{ esxi_iso_folder }}/{{ esxi_patch_package }}"

- name: Log ISO location
  ansible.builtin.debug:
    msg: "datastore={{ esxi_ds_name }} mount={{ esxi_ds_mount }} iso={{ esxi_iso_dir }} patch={{ esxi_patch_path }}"

- name: Ensure ISO folder exists on datastore
  ansible.builtin.file:
    path: "{{ esxi_iso_dir }}"
    state: directory
    mode: "0755"

- name: Check if patch package already exists
  ansible.builtin.stat:
    path: "{{ esxi_patch_path }}"
  register: esxi_patch_stat

- name: Fail if patch URL missing and package not on datastore
  ansible.builtin.fail:
    msg: "Patch not found at {{ esxi_patch_path }} and cannot download (af_url/esxi_patch_package empty)"
  when:
    - not esxi_patch_stat.stat.exists
    - (af_url | default('') | length == 0) or (esxi_patch_package | default('') | length == 0)

- name: Download patch from Artifactory to controller
  ansible.builtin.get_url:
    url: "{{ esxi_patch_url }}"
    dest: "/tmp/{{ esxi_patch_package }}"
    url_username: "{{ artifactory_user | default(omit) }}"
    url_password: "{{ artifactory_password | default(omit) }}"
    force_basic_auth: true
    validate_certs: "{{ artifactory_validate_certs }}"
    mode: "0644"
  delegate_to: localhost
  when: not esxi_patch_stat.stat.exists

- name: Copy patch package to ISO folder
  ansible.builtin.copy:
    src: "/tmp/{{ esxi_patch_package }}"
    dest: "{{ esxi_patch_path }}"
    mode: "0644"
  when: not esxi_patch_stat.stat.exists

- name: Initialize VIB path list
  ansible.builtin.set_fact:
    esxi_vib_paths: []

- name: Skip VIB download when esxi_vibs is not defined or empty
  ansible.builtin.debug:
    msg: "esxi_vibs is not defined or empty, skip VIB download"
  when: esxi_vibs | default([]) | length == 0

- name: Fail if any VIB item is missing filename
  ansible.builtin.fail:
    msg: "esxi_vibs item is missing filename: {{ item }}"
  loop: "{{ esxi_vibs | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item.filename | default(item)) }}"
  when:
    - esxi_vibs | default([]) | length > 0
    - item.filename | default('') | length == 0

- name: Check each VIB zip on ISO folder
  ansible.builtin.stat:
    path: "{{ esxi_iso_dir }}/{{ item.filename }}"
  register: esxi_vib_stats
  loop: "{{ esxi_vibs | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item.filename) }}"
  when: esxi_vibs | default([]) | length > 0

- name: Download missing VIBs from Artifactory to controller
  ansible.builtin.get_url:
    url: "{{ item.item.url | default((af_url | regex_replace('/$', '')) ~ '/' ~ item.item.filename) }}"
    dest: "/tmp/{{ item.item.filename }}"
    url_username: "{{ artifactory_user | default(omit) }}"
    url_password: "{{ artifactory_password | default(omit) }}"
    force_basic_auth: true
    validate_certs: "{{ artifactory_validate_certs }}"
    mode: "0644"
  delegate_to: localhost
  loop: "{{ esxi_vib_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default(item.item.filename) }}"
  when:
    - esxi_vibs | default([]) | length > 0
    - item is not skipped
    - not (item.stat.exists | default(false))

- name: Copy missing VIBs to ISO folder
  ansible.builtin.copy:
    src: "/tmp/{{ item.item.filename }}"
    dest: "{{ esxi_iso_dir }}/{{ item.item.filename }}"
    mode: "0644"
  loop: "{{ esxi_vib_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default(item.item.filename) }}"
  when:
    - esxi_vibs | default([]) | length > 0
    - item is not skipped
    - not (item.stat.exists | default(false))

- name: Register VIB paths
  ansible.builtin.set_fact:
    esxi_vib_paths: "{{ esxi_vib_paths + [vib_item] }}"
  vars:
    vib_item:
      name: "{{ item.name | default(item.filename) }}"
      filename: "{{ item.filename }}"
      path: "{{ esxi_iso_dir }}/{{ item.filename }}"
  loop: "{{ esxi_vibs | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item.filename) }}"
  when: esxi_vibs | default([]) | length > 0




---
# serial: 1 时 run_once 是每个 batch 一次（等于每台都跑）。
# vCenter 查询只在 play 第一台还没有结果时执行，其它主机复用 hostvars。

- name: Fail if cluster_name is not set
  ansible.builtin.fail:
    msg: "cluster_name is required so only ESXi hosts in that cluster are patched"
  when: cluster_name | default('') | string | trim | length == 0

- name: Fail if storage_type is invalid
  ansible.builtin.fail:
    msg: "storage_type must be 'vsan' or 'powerflex' (got '{{ storage_type | default('') }}')"
  when: storage_type | lower not in ['vsan', 'powerflex']

- name: Gather target cluster info from vCenter
  community.vmware.vmware_cluster_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ validate_certs }}"
    cluster_name: "{{ cluster_name }}"
  register: esxi_cluster_info
  delegate_to: localhost
  when:
    - inventory_hostname == ansible_play_hosts_all[0]
    - hostvars[ansible_play_hosts_all[0]].esxi_cluster_info is not defined

- name: Resolve cluster membership on this host
  ansible.builtin.set_fact:
    esxi_cluster_key: "{{ _cluster_key }}"
    esxi_cluster_hosts_raw: "{{ _hosts_raw }}"
    esxi_cluster_host_names: "{{ _hosts_raw | map('lower') | list }}"
    esxi_cluster_host_short: "{{ _hosts_raw | map('regex_replace', '\\..*$', '') | map('lower') | list }}"
    esxi_cluster_inventory_hosts: "{{ _inv_hosts }}"
    esxi_prepare_host: "{{ _inv_hosts[0] | default('') }}"
    esxi_in_target_cluster: "{{ (inventory_hostname | lower in (_hosts_raw | map('lower') | list)) or (inventory_hostname.split('.')[0] | lower in (_hosts_raw | map('regex_replace', '\\..*$', '') | map('lower') | list)) }}"
  vars:
    _anchor: "{{ ansible_play_hosts_all[0] }}"
    _clusters: "{{ hostvars[_anchor].esxi_cluster_info.clusters | default({}) }}"
    _cluster_key: "{{ cluster_name if cluster_name in _clusters else (_clusters.keys() | list | first | default('')) }}"
    _hosts_raw: "{{ _clusters[_cluster_key].hosts | default([]) if _cluster_key else [] }}"
    _inv_hosts: >-
      {%- set ns = namespace(hosts=[]) -%}
      {%- set names = _hosts_raw | map('lower') | list -%}
      {%- set shorts = _hosts_raw | map('regex_replace', '\..*$', '') | map('lower') | list -%}
      {%- for h in ansible_play_hosts_all -%}
        {%- if (h | lower in names) or (h.split('.')[0] | lower in shorts) -%}
          {%- set ns.hosts = ns.hosts + [h] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.hosts }}

- name: Fail if cluster was not found
  ansible.builtin.fail:
    msg: "Cluster '{{ cluster_name }}' not found in vCenter {{ vcenter_hostname }}"
  when: esxi_cluster_key | default('') | length == 0

- name: Fail if no inventory host is in cluster
  ansible.builtin.fail:
    msg: "No inventory host belongs to cluster '{{ cluster_name }}'. Cluster hosts: {{ esxi_cluster_hosts_raw }}"
  when: esxi_cluster_inventory_hosts | default([]) | length == 0

- name: Show cluster targeting
  ansible.builtin.debug:
    msg: >-
      cluster={{ cluster_name }} storage_type={{ storage_type }}
      in_cluster={{ esxi_in_target_cluster }} prepare_host={{ esxi_prepare_host }}



---
- name: Share patch paths from the prepare host to this host
  ansible.builtin.set_fact:
    esxi_patch_path: "{{ hostvars[_prep_host].esxi_patch_path }}"
    esxi_iso_dir: "{{ hostvars[_prep_host].esxi_iso_dir }}"
    esxi_ds_name: "{{ hostvars[_prep_host].esxi_ds_name }}"
    esxi_ds_mount: "{{ hostvars[_prep_host].esxi_ds_mount }}"
    esxi_vib_paths: "{{ hostvars[_prep_host].esxi_vib_paths | default([]) }}"
  vars:
    _prep_host: "{{ esxi_prepare_host | default(ansible_play_hosts_all[0]) }}"
