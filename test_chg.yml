---
- name: Query ITSM Linked CHG Tickets
  hosts: localhost
  gather_facts: false
  vars:
    itsm_api_base: "https://itsm.example.com/api/v1"
    auth_headers:
      Authorization: "Bearer YOUR_API_TOKEN"
      Content-Type: "application/json"
    
    # 假设这是上一步获得的 ticket_info 变量
    # ticket_info: "{{ response.json }}"

  tasks:
    # 步骤 1：提取所有 outwardIssue 以 CHG 开头的单号
    - name: Extract CHG ticket IDs from linked Issues
      ansible.builtin.set_fact:
        chg_candidates: >-
          {%- set chgs = [] -%}
          {%- for issue in ticket_info['linked Issues'] | default([]) -%}
            {%- set val = issue.outwardIssue.key if (issue.outwardIssue is mapping) else issue.outwardIssue -%}
            {%- if val is defined and val is regex('^CHG') -%}
              {%- set _ = chgs.append(val) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ chgs }}

    # 步骤 2：遍历 API 查询每一个 CHG 单据的详细信息
    - name: Query details for each CHG ticket
      ansible.builtin.uri:
        url: "{{ itsm_api_base }}/tickets/{{ item }}"
        method: GET
        headers: "{{ auth_headers }}"
        return_content: true
        status_code: [200]
      loop: "{{ chg_candidates }}"
      register: chg_query_results
      when: chg_candidates | length > 0

- name: Debug - Inspect extracted fields
      ansible.builtin.debug:
        msg:
          - "Ticket ID: {{ item.item }}"
          - "Raw Issue Data: {{ item.json.issues[item.item] if (item.json is defined and item.json.issues is defined and item.item in item.json.issues) else 'NOT_FOUND' }}"
          - "Issue Type: '{{ item.json.issues[item.item].issue_type | default('N/A') }}'"
          - "Affected Service: {{ item.json.issues[item.item].affected_service | default('N/A') }}"
          - "Affected Service Type: {{ item.json.issues[item.item].affected_service | type_debug if (item.json is defined and item.json.issues is defined and item.item in item.json.issues) else 'N/A' }}"
      loop: "{{ chg_query_results.results }}"
      when: chg_query_results.results is defined

- name: Filter target_CHG with type 'standard CHG' and system 'Linux'
      ansible.builtin.set_fact:
        target_CHG: >-
          {%- set targets = [] -%}
          {%- if chg_query_results.results is defined -%}
            {%- for res in chg_query_results.results -%}
              {# 确保请求成功且返回的 issues 字典里包含当前单号 #}
              {%- if res.json is defined and res.json.issues is defined and res.item in res.json.issues -%}
                {%- set issue_data = res.json.issues[res.item] -%}
                
                {# 1. 获取单据类型 #}
                {%- set t_type = issue_data.issue_type | default('') -%}
                
                {# 2. 获取受影响服务列表，并做不区分大小写的转换 #}
                {%- set raw_services = issue_data.affected_service | default([]) -%}
                {%- set services_lower = raw_services | map('lower') | list -%}
                
                {# 3. 条件判断：类型为 'standard chg' 且 'linux' 在 affected_service 列表中 #}
                {%- if (t_type | lower == 'standard chg') and ('linux' in services_lower) -%}
                  {%- set _ = targets.append(res.item) -%}
                {%- endif -%}
              {%- me -%} {# 容错处理 #}
            {%- endfor -%}
          {%- endif -%}
          {{ targets }}
    - name: Output filtered target CHG list
      ansible.builtin.debug:
        var: target_CHG



- name: Check if current CHG matches criteria and append to target
      ansible.builtin.set_fact:
        target_CHGs: "{{ target_CHGs + [item] }}"
      vars:
        # 获取当前 Ticket 接口返回的 issue 数据对象
        # 优先使用 .values()[0] 避免 key 匹配陷阱
        issue_data: "{{ (single_chg_res.json.issues.values() | list)[0] if (single_chg_res.json is defined and single_chg_res.json.issues is defined and (single_chg_res.json.issues | length > 0)) else {} }}"
        
        t_type: "{{ issue_data.issue_type | default('') }}"
        raw_services: "{{ issue_data.affected_service | default([]) }}"
        services_lower: "{{ raw_services | map('lower') | list }}"
      when:
        - (t_type | lower == 'standard chg')
        - ('linux' in services_lower)
